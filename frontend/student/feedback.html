<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Feedback</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/student/dashboard.html"
            class="navbar-brand"
        >
            Student Dashboard
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <h1>
        Event Feedback
    </h1>


    <div id="message"></div>


    <div class="card shadow p-4 mt-4">

        <h4>
            Submit Feedback
        </h4>


        <form id="feedbackForm">

            <div class="mb-3">

                <label class="form-label">
                    Event
                </label>

                <select
                    id="event_id"
                    class="form-select"
                    required
                ></select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Rating
                </label>

                <select
                    id="rating"
                    class="form-select"
                    required
                >

                    <option value="5">
                        5 - Excellent
                    </option>

                    <option value="4">
                        4 - Very Good
                    </option>

                    <option value="3">
                        3 - Good
                    </option>

                    <option value="2">
                        2 - Fair
                    </option>

                    <option value="1">
                        1 - Poor
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Comment
                </label>

                <textarea
                    id="comment"
                    class="form-control"
                    rows="4"
                ></textarea>

            </div>


            <button
                class="btn btn-primary"
            >
                Submit Feedback
            </button>

        </form>

    </div>


    <div
        id="myFeedback"
        class="mt-5"
    ></div>

</div>


<script src="/js/main.js"></script>


<script>

async function loadRegistrations() {

    const data =
        await apiFetch(
            "/api/registrations/my"
        );


    const select =
        document.getElementById(
            "event_id"
        );


    const active =
        data.registrations.filter(
            item =>
                item.status ===
                "registered"
        );


    if (active.length === 0) {

        select.innerHTML = `
            <option>
                No registered events
            </option>
        `;

        return;

    }


    select.innerHTML =
        active.map(
            item => `

                <option
                    value="${item.event_id}"
                >
                    ${item.title}
                </option>

            `
        ).join("");

}



document
    .getElementById(
        "feedbackForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            try {

                const data =
                    await apiFetch(
                        "/api/feedback",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({

                                    event_id:
                                        Number(
                                            document
                                            .getElementById(
                                                "event_id"
                                            ).value
                                        ),

                                    rating:
                                        Number(
                                            document
                                            .getElementById(
                                                "rating"
                                            ).value
                                        ),

                                    comment:
                                        document
                                        .getElementById(
                                            "comment"
                                        ).value

                                })
                        }
                    );


                showMessage(
                    "message",
                    data.message,
                    "success"
                );


                document
                    .getElementById(
                        "comment"
                    )
                    .value = "";


                loadFeedback();


            } catch (error) {

                showMessage(
                    "message",
                    error.message,
                    "danger"
                );

            }

        }
    );



async function loadFeedback() {

    try {

        const data =
            await apiFetch(
                "/api/feedback/my"
            );


        const feedback =
            data.feedback;


        document
            .getElementById(
                "myFeedback"
            )
            .innerHTML = `

                <h3>
                    My Submitted Feedback
                </h3>

                ${
                    feedback.length === 0
                    ?
                    `<p>No feedback submitted yet.</p>`
                    :
                    feedback.map(
                        item => `

                            <div class="card shadow p-3 mb-3">

                                <h5>
                                    ${item.title}
                                </h5>

                                <p class="rating">
                                    ⭐ ${item.rating}/5
                                </p>

                                <p>
                                    ${item.comment || ""}
                                </p>

                            </div>

                        `
                    ).join("")
                }

            `;


    } catch (error) {

        console.error(error);

    }

}


loadRegistrations();
loadFeedback();

</script>

</body>

</html>
