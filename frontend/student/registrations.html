<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Registrations</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/student/dashboard.html"
            class="navbar-brand"
        >
            Student Dashboard
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <h1>
        My Registrations
    </h1>


    <div id="message"></div>


    <div id="registrationContainer"></div>

</div>


<script src="/js/main.js"></script>


<script>

async function loadRegistrations() {

    try {

        const data =
            await apiFetch(
                "/api/registrations/my"
            );


        const registrations =
            data.registrations;


        const container =
            document.getElementById(
                "registrationContainer"
            );


        if (
            registrations.length === 0
        ) {

            container.innerHTML = `
                <div class="alert alert-info mt-4">
                    You have no registrations.
                </div>
            `;

            return;
        }


        container.innerHTML = `

            <div class="table-responsive mt-4">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">

                        <tr>

                            <th>Event</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            registrations.map(
                                item => `

                                <tr>

                                    <td>
                                        ${item.title}
                                    </td>

                                    <td>
                                        ${formatDate(
                                            item.event_date
                                        )}
                                    </td>

                                    <td>
                                        ${item.venue}
                                    </td>

                                    <td>
                                        ${item.status}
                                    </td>

                                    <td>

                                        ${
                                            item.status ===
                                            "registered"
                                            ?
                                            `<button
                                                class="btn btn-danger btn-sm"
                                                onclick="cancelRegistration(
                                                    ${item.registration_id}
                                                )"
                                            >
                                                Cancel
                                            </button>`
                                            :
                                            "-"
                                        }

                                    </td>

                                </tr>
                            `
                            ).join("")
                        }

                    </tbody>

                </table>

            </div>

        `;


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}



async function cancelRegistration(id) {

    if (
        !confirm(
            "Cancel this registration?"
        )
    ) {
        return;
    }


    try {

        const data =
            await apiFetch(
                `/api/registrations/${id}`,
                {
                    method: "DELETE"
                }
            );


        showMessage(
            "message",
            data.message,
            "success"
        );


        loadRegistrations();


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}


loadRegistrations();

</script>

</body>

</html>
