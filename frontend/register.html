<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - UniEvents</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            UniEvents
        </a>

    </div>

</nav>


<div class="container">

    <div class="auth-container">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Create Account
            </h2>


            <div id="message"></div>


            <form id="registerForm">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        minlength="6"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Account Type
                    </label>

                    <select
                        id="role"
                        class="form-select"
                    >

                        <option value="student">
                            Student
                        </option>

                        <option value="organizer">
                            Organizer
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        class="form-control"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Register
                </button>

            </form>


            <p class="text-center mt-3">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>


<script src="/js/main.js"></script>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const password =
                document
                .getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document
                .getElementById(
                    "confirmPassword"
                ).value;


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "message",
                    "Passwords do not match.",
                    "danger"
                );

                return;
            }


            try {

                await apiFetch(
                    "/api/auth/register",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({

                                name:
                                    document
                                    .getElementById(
                                        "name"
                                    ).value,

                                email:
                                    document
                                    .getElementById(
                                        "email"
                                    ).value,

                                password:
                                    password,

                                role:
                                    document
                                    .getElementById(
                                        "role"
                                    ).value,

                                department:
                                    document
                                    .getElementById(
                                        "department"
                                    ).value,

                                phone:
                                    document
                                    .getElementById(
                                        "phone"
                                    ).value

                            })
                    }
                );


                alert(
                    "Registration successful. Please login."
                );


                window.location.href =
                    "/login.html";


            } catch (error) {

                showMessage(
                    "message",
                    error.message,
                    "danger"
                );

            }

        }
    );

</script>

</body>

</html>
