<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events - UniEvents</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            UniEvents
        </a>

        <a
            class="btn btn-outline-light"
            href="/login.html"
        >
            Login
        </a>

    </div>

</nav>


<div class="container py-5">

    <h1 class="mb-4">
        University Events
    </h1>


    <div class="row mb-4">

        <div class="col-md-8">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search events..."
            >

        </div>


        <div class="col-md-4">

            <select
                id="categoryFilter"
                class="form-select"
            >

                <option value="">
                    All Categories
                </option>

                <option value="seminar">
                    Seminar
                </option>

                <option value="workshop">
                    Workshop
                </option>

                <option value="competition">
                    Competition
                </option>

                <option value="sports">
                    Sports
                </option>

                <option value="cultural">
                    Cultural
                </option>

                <option value="other">
                    Other
                </option>

            </select>

        </div>

    </div>


    <div
        id="eventContainer"
        class="row g-4"
    ></div>

</div>


<script src="/js/main.js"></script>


<script>

let allEvents = [];


async function loadEvents() {

    try {

        const data =
            await apiFetch(
                "/api/events"
            );

        allEvents =
            data.events;

        displayEvents(
            allEvents
        );

    } catch (error) {

        document.getElementById(
            "eventContainer"
        ).innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

}



function displayEvents(events) {

    const container =
        document.getElementById(
            "eventContainer"
        );


    if (events.length === 0) {

        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-info">
                    No events found.
                </div>
            </div>
        `;

        return;
    }


    container.innerHTML =
        events.map(event => `

            <div class="col-md-4">

                <div class="card shadow event-card h-100">

                    ${
                        event.image_url
                        ?
                        `<img
                            src="${event.image_url}"
                            class="event-image"
                        >`
                        :
                        ""
                    }

                    <div class="card-body">

                        <span class="badge bg-primary">
                            ${event.category}
                        </span>

                        <h5 class="mt-2">
                            ${event.title}
                        </h5>

                        <p>
                            ${event.description.substring(
                                0,
                                100
                            )}...
                        </p>

                        <p class="small-text">
                            📅 ${formatDate(
                                event.event_date
                            )}
                            <br>
                            📍 ${event.venue}
                            <br>
                            👥 ${event.registered_count}
                            / ${event.capacity}
                        </p>

                        <a
                            href="/event-details.html?id=${event.event_id}"
                            class="btn btn-primary"
                        >
                            View Details
                        </a>

                    </div>

                </div>

            </div>

        `).join("");

}



function filterEvents() {

    const search =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const filtered =
        allEvents.filter(event => {

            const matchesSearch =
                event.title
                    .toLowerCase()
                    .includes(search)
                ||
                event.venue
                    .toLowerCase()
                    .includes(search)
                ||
                event.organizer_name
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =
                !category ||
                event.category === category;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    displayEvents(
        filtered
    );

}


document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        filterEvents
    );


document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        filterEvents
    );


loadEvents();

</script>

</body>

</html>
