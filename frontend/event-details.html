<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Details - UniEvents</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            UniEvents
        </a>

        <a
            class="btn btn-outline-light"
            href="/events.html"
        >
            All Events
        </a>

    </div>

</nav>


<div class="container py-5">

    <div id="message"></div>

    <div id="eventContainer"></div>

</div>


<script src="/js/main.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("id");


async function loadEvent() {

    try {

        const data =
            await apiFetch(
                `/api/events/${eventId}`
            );


        const event =
            data.event;


        document
            .getElementById(
                "eventContainer"
            )
            .innerHTML = `

                <div class="card shadow">

                    ${
                        event.image_url
                        ?
                        `<img
                            src="${event.image_url}"
                            class="event-image"
                        >`
                        :
                        ""
                    }

                    <div class="card-body p-4">

                        <span class="badge bg-primary">
                            ${event.category}
                        </span>

                        <h1 class="mt-3">
                            ${event.title}
                        </h1>

                        <p>
                            ${event.description}
                        </p>

                        <hr>

                        <p>
                            <strong>Date:</strong>
                            ${formatDate(
                                event.event_date
                            )}
                        </p>

                        <p>
                            <strong>Time:</strong>
                            ${event.start_time}
                            ${
                                event.end_time
                                ?
                                " - " +
                                event.end_time
                                :
                                ""
                            }
                        </p>

                        <p>
                            <strong>Venue:</strong>
                            ${event.venue}
                        </p>

                        <p>
                            <strong>Organizer:</strong>
                            ${event.organizer_name}
                        </p>

                        <p>
                            <strong>Capacity:</strong>
                            ${event.registered_count}
                            /
                            ${event.capacity}
                        </p>

                        ${
                            event.registration_deadline
                            ?
                            `<p>
                                <strong>
                                    Registration Deadline:
                                </strong>
                                ${formatDate(
                                    event.registration_deadline
                                )}
                            </p>`
                            :
                            ""
                        }

                        <button
                            class="btn btn-success"
                            onclick="registerEvent()"
                        >
                            Register for Event
                        </button>

                    </div>

                </div>
            `;


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}



async function registerEvent() {

    try {

        const user =
            await getCurrentUser();


        if (!user) {

            window.location.href =
                "/login.html";

            return;
        }


        if (
            user.role !==
            "student"
        ) {

            showMessage(
                "message",
                "Only students can register for events.",
                "warning"
            );

            return;
        }


        const data =
            await apiFetch(
                "/api/registrations",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            event_id:
                                Number(eventId)
                        })
                }
            );


        showMessage(
            "message",
            data.message,
            "success"
        );


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}


loadEvent();

</script>

</body>

</html>
