<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Organizer Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Organizer Dashboard
        </span>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <h1>
        Welcome, <span id="name"></span>
    </h1>

    <p>
        Manage your university events.
    </p>


    <div class="row g-4 mt-3">


        <div class="col-md-4">

            <div class="card shadow p-4 dashboard-card">

                <h3>
                    ➕ Create Event
                </h3>

                <p>
                    Create a new university event.
                </p>

                <a
                    href="/organizer/create-event.html"
                    class="btn btn-primary"
                >
                    Create
                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow p-4 dashboard-card">

                <h3>
                    📋 Manage Events
                </h3>

                <p>
                    View and manage your events.
                </p>

                <a
                    href="/organizer/events.html"
                    class="btn btn-primary"
                >
                    Manage
                </a>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow p-4 dashboard-card">

                <h3>
                    👥 Participants
                </h3>

                <p>
                    Manage event participants and attendance.
                </p>

                <a
                    href="/organizer/events.html"
                    class="btn btn-primary"
                >
                    View
                </a>

            </div>

        </div>

    </div>

</div>


<script src="/js/main.js"></script>


<script>

async function loadUser() {

    const user =
        await getCurrentUser();


    if (!user) {

        window.location.href =
            "/login.html";

        return;

    }


    if (
        user.role !==
        "organizer"
    ) {

        window.location.href =
            "/student/dashboard.html";

        return;

    }


    document
        .getElementById(
            "name"
        )
        .textContent =
            user.name;

}


loadUser();

</script>

</body>

</html>
