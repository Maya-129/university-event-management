<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Event</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/organizer/dashboard.html"
            class="navbar-brand"
        >
            Organizer Dashboard
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <h1>
        Create New Event
    </h1>

    <p class="text-muted">
        Your event will be published immediately.
    </p>


    <div id="message"></div>


    <div class="card shadow p-4 mt-4">

        <form id="eventForm">

            <div class="mb-3">

                <label class="form-label">
                    Event Title
                </label>

                <input
                    type="text"
                    id="title"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    rows="5"
                    required
                ></textarea>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    id="category"
                    class="form-select"
                    required
                >

                    <option value="seminar">
                        Seminar
                    </option>

                    <option value="workshop">
                        Workshop
                    </option>

                    <option value="competition">
                        Competition
                    </option>

                    <option value="sports">
                        Sports
                    </option>

                    <option value="cultural">
                        Cultural
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Event Date
                    </label>

                    <input
                        type="date"
                        id="event_date"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Start Time
                    </label>

                    <input
                        type="time"
                        id="start_time"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        End Time
                    </label>

                    <input
                        type="time"
                        id="end_time"
                        class="form-control"
                    >

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Venue
                </label>

                <input
                    type="text"
                    id="venue"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Capacity
                </label>

                <input
                    type="number"
                    id="capacity"
                    class="form-control"
                    min="1"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Registration Deadline
                </label>

                <input
                    type="date"
                    id="registration_deadline"
                    class="form-control"
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Image URL
                </label>

                <input
                    type="url"
                    id="image_url"
                    class="form-control"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            <button
                type="submit"
                class="btn btn-success"
            >
                Create Event
            </button>


            <a
                href="/organizer/dashboard.html"
                class="btn btn-secondary"
            >
                Back
            </a>

        </form>

    </div>

</div>


<script src="/js/main.js"></script>


<script>

async function checkOrganizer() {

    const user =
        await getCurrentUser();


    if (
        !user ||
        user.role !== "organizer"
    ) {

        window.location.href =
            "/login.html";

    }

}


document
    .getElementById(
        "eventForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            try {

                const data =
                    await apiFetch(
                        "/api/events",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({

                                    title:
                                        document
                                        .getElementById(
                                            "title"
                                        ).value,

                                    description:
                                        document
                                        .getElementById(
                                            "description"
                                        ).value,

                                    category:
                                        document
                                        .getElementById(
                                            "category"
                                        ).value,

                                    event_date:
                                        document
                                        .getElementById(
                                            "event_date"
                                        ).value,

                                    start_time:
                                        document
                                        .getElementById(
                                            "start_time"
                                        ).value,

                                    end_time:
                                        document
                                        .getElementById(
                                            "end_time"
                                        ).value,

                                    venue:
                                        document
                                        .getElementById(
                                            "venue"
                                        ).value,

                                    capacity:
                                        Number(
                                            document
                                            .getElementById(
                                                "capacity"
                                            ).value
                                        ),

                                    registration_deadline:
                                        document
                                        .getElementById(
                                            "registration_deadline"
                                        ).value,

                                    organization_id:
                                        1,

                                    image_url:
                                        document
                                        .getElementById(
                                            "image_url"
                                        ).value

                                })
                        }
                    );


                showMessage(
                    "message",
                    data.message,
                    "success"
                );


                document
                    .getElementById(
                        "eventForm"
                    )
                    .reset();


            } catch (error) {

                showMessage(
                    "message",
                    error.message,
                    "danger"
                );

            }

        }
    );


checkOrganizer();

</script>

</body>

</html>
