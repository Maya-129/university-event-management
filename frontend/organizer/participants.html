<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Participants</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/organizer/events.html"
            class="navbar-brand"
        >
            Manage Events
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <h1>
        Event Participants
    </h1>


    <div id="message"></div>


    <div
        id="participants"
        class="mt-4"
    ></div>

</div>


<script src="/js/main.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event_id");


async function loadParticipants() {

    try {

        const data =
            await apiFetch(
                `/api/attendance/event/${eventId}`
            );


        const participants =
            data.participants;


        if (
            participants.length === 0
        ) {

            document
                .getElementById(
                    "participants"
                )
                .innerHTML = `
                    <div class="alert alert-info">
                        No participants yet.
                    </div>
                `;

            return;

        }


        document
            .getElementById(
                "participants"
            )
            .innerHTML = `

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead class="table-dark">

                            <tr>

                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Attendance</th>

                            </tr>

                        </thead>

                        <tbody>

                            ${
                                participants.map(
                                    participant => `

                                        <tr>

                                            <td>
                                                ${participant.name}
                                            </td>

                                            <td>
                                                ${participant.email}
                                            </td>

                                            <td>
                                                ${participant.department || "-"}
                                            </td>

                                            <td>

                                                <select
                                                    class="form-select"
                                                    onchange="
                                                        markAttendance(
                                                            ${participant.user_id},
                                                            this.value
                                                        )
                                                    "
                                                >

                                                    <option
                                                        value="absent"
                                                        ${
                                                            participant.attendance_status ===
                                                            "absent"
                                                            ? "selected"
                                                            : ""
                                                        }
                                                    >
                                                        Absent
                                                    </option>

                                                    <option
                                                        value="present"
                                                        ${
                                                            participant.attendance_status ===
                                                            "present"
                                                            ? "selected"
                                                            : ""
                                                        }
                                                    >
                                                        Present
                                                    </option>

                                                </select>

                                            </td>

                                        </tr>

                                    `
                                ).join("")
                            }

                        </tbody>

                    </table>

                </div>

            `;


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}



async function markAttendance(
    userId,
    status
) {

    try {

        const data =
            await apiFetch(
                `/api/attendance/event/${eventId}`,
                {
                    method: "POST",

                    body:
                        JSON.stringify({

                            user_id:
                                userId,

                            attendance_status:
                                status

                        })
                }
            );


        showMessage(
            "message",
            data.message,
            "success"
        );


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}


loadParticipants();

</script>

</body>

</html>
