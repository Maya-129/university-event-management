<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Events</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/organizer/dashboard.html"
            class="navbar-brand"
        >
            Organizer Dashboard
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between mb-4">

        <h1>
            My Events
        </h1>

        <a
            href="/organizer/create-event.html"
            class="btn btn-success"
        >
            + Create Event
        </a>

    </div>


    <div id="message"></div>


    <div id="events"></div>

</div>


<script src="/js/main.js"></script>


<script>

async function loadEvents() {

    try {

        const data =
            await apiFetch(
                "/api/events/organizer/my-events"
            );


        const events =
            data.events;


        const container =
            document.getElementById(
                "events"
            );


        if (events.length === 0) {

            container.innerHTML = `
                <div class="alert alert-info">
                    You have not created any events.
                </div>
            `;

            return;
        }


        container.innerHTML =
            events.map(
                event => `

                    <div class="card shadow p-4 mb-4">

                        <div class="d-flex justify-content-between">

                            <div>

                                <h3>
                                    ${event.title}
                                </h3>

                                <p>
                                    ${event.description}
                                </p>

                                <p class="small-text">

                                    Category:
                                    ${event.category}

                                    <br>

                                    Date:
                                    ${formatDate(
                                        event.event_date
                                    )}

                                    <br>

                                    Venue:
                                    ${event.venue}

                                    <br>

                                    Participants:
                                    ${event.registered_count}
                                    /
                                    ${event.capacity}

                                </p>

                            </div>


                            <div>

                                <button
                                    class="btn btn-danger btn-sm mb-2"
                                    onclick="deleteEvent(
                                        ${event.event_id}
                                    )"
                                >
                                    Delete
                                </button>

                                <br>

                                <a
                                    href="/organizer/participants.html?event_id=${event.event_id}"
                                    class="btn btn-primary btn-sm mb-2"
                                >
                                    Participants
                                </a>

                                <br>

                                <a
                                    href="/organizer/feedback.html?event_id=${event.event_id}"
                                    class="btn btn-secondary btn-sm"
                                >
                                    Feedback
                                </a>

                            </div>

                        </div>

                    </div>

                `
            ).join("");


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}



async function deleteEvent(id) {

    if (
        !confirm(
            "Are you sure you want to delete this event?"
        )
    ) {
        return;
    }


    try {

        const data =
            await apiFetch(
                `/api/events/${id}`,
                {
                    method: "DELETE"
                }
            );


        showMessage(
            "message",
            data.message,
            "success"
        );


        loadEvents();


    } catch (error) {

        showMessage(
            "message",
            error.message,
            "danger"
        );

    }

}


loadEvents();

</script>

</body>

</html>
